name: release

on:
  push:
    tags:
      - "v*"

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Prepare generated embed inputs
        run: |
          mkdir -p assets/monitor-ui
          touch assets/monitor-ui/index.html
          touch assets/agentbin/singbox-deploy-agent-linux-amd64
          touch assets/agentbin/singbox-deploy-agent-linux-arm64

      - name: Run vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/monitor/pnpm-lock.yaml

      - name: Build monitor UI
        run: |
          pnpm --dir web/monitor install --frozen-lockfile
          pnpm --dir web/monitor build

      - name: Build embedded agent binaries
        run: |
          # The deploy binary embeds both agent architectures from
          # assets/agentbin, so generate them before testing or building deploy.
          rm -f assets/agentbin/singbox-deploy-agent-linux-*
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} \
              go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o assets/agentbin/singbox-deploy-agent-linux-${arch} ./cmd/singbox-deploy-agent
          done

      - name: Run tests
        run: go test ./...

      - name: Build deploy binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} \
              go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/singbox-deploy-linux-${arch} ./cmd/singbox-deploy
          done
          cp scripts/install.sh dist/install.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum singbox-deploy-linux-amd64 singbox-deploy-linux-arm64 install.sh > SHA256SUMS

      - name: Check if first release
        id: check
        run: |
          # grep exits 1 when only the current tag exists (first release); the
          # default pipefail shell would otherwise fail this step.
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          echo "is_first=$([ -z "$PREV_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.is_first == 'true'
        with:
          body: "Initial release of singbox-deploy."
          files: dist/*

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.is_first == 'false'
        with:
          generate_release_notes: true
          files: dist/*
