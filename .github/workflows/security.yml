name: security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Prepare generated embed inputs
        run: |
          mkdir -p assets/monitor-ui
          touch assets/monitor-ui/index.html
          touch assets/agentbin/singbox-deploy-agent-linux-amd64
          touch assets/agentbin/singbox-deploy-agent-linux-arm64

      - name: Test installer
        run: scripts/install_test.sh

      - name: Run vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
