<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e17" />
    <title>Monitor</title>
    <!-- A remembered theme is applied before the first paint, so a viewer who
         chose dark on a light system never sees a light frame flash first. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("singbox-deploy.monitor.theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
